[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aurum-platform-backend"
version = "0.1.0"
description = "Aurum Platform — Phase 1 backend skeleton"
requires-python = "==3.12.*"
authors = [{ name = "Flevian Gonsalves" }]
license = { text = "Proprietary" }

dependencies = [
    # Web framework
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "starlette==0.41.3",

    # Settings / validation
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "email-validator==2.2.0",

    # Database (async)
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "psycopg2-binary==2.9.10",
    "alembic==1.14.0",
    "greenlet==3.1.1",

    # Auth / crypto
    "python-jose[cryptography]==3.3.0",
    "argon2-cffi==23.1.0",
    "pynacl==1.5.0",
    "webauthn==2.5.2",

    # Rate limiting
    "slowapi==0.1.9",
    "limits==3.13.0",
    "redis==5.2.1",

    # Logging / utilities
    "structlog==24.4.0",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "anyio==4.7.0",
    "asgi-lifespan==2.1.0",
    "ruff==0.8.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:jose.*",
]

[tool.ruff]
line-length = 100
target-version = "py312"
