<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aurum — Offline</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        background: #0b0f1f; color: #e2e8f0;
        font-family: Inter, system-ui, -apple-system, sans-serif;
      }
      .card { max-width: 28rem; padding: 2rem; text-align: center; }
      h1 { margin: 0 0 0.5rem; font-size: 1.5rem; }
      p { margin: 0; color: #94a3b8; }
      button { margin-top: 1.5rem; padding: 0.6rem 1.2rem; border-radius: 0.5rem; border: 0;
               background: #4f46e5; color: white; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline</h1>
      <p>Aurum needs a connection to fetch live broker data. Reconnect and try again.</p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
